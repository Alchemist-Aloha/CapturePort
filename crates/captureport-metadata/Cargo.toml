[package]
name = "captureport-metadata"
version = "0.6.0"
edition = "2024"
license = "MIT"
rust-version.workspace = true

[dependencies]
captureport-core = { path = "../captureport-core" }
kamadak-exif = "0.6.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3.27.0"
