[package]
name = "captureport-ingest"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
captureport-core = { path = "../captureport-core" }
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
nix = { version = "0.31.3", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
captureport-media = { path = "../captureport-media" }

[lints]
workspace = true
