[package]
name = "captureport-ingest"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
captureport-core = { path = "../captureport-core" }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
captureport-media = { path = "../captureport-media" }

[lints]
workspace = true
