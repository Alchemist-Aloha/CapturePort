[package]
name = "captureport"
version = "0.6.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
captureport-core = { path = "../captureport-core" }
captureport-media = { path = "../captureport-media" }
captureport-catalog = { path = "../captureport-catalog" }
captureport-ingest = { path = "../captureport-ingest" }
captureport-metadata = { path = "../captureport-metadata" }
captureport-gphoto = { path = "../captureport-gphoto" }
gpui = "0.2.2"
unicode-segmentation = "1.13.3"
chrono = { version = "0.4.45", features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
