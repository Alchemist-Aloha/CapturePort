<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  width="128"
  height="128"
  role="img"
  aria-labelledby="captureport-title captureport-desc"
  shape-rendering="geometricPrecision">
  <title id="captureport-title">CapturePort</title>
  <desc id="captureport-desc">A seven-segment C and P merged into the outline of the 田 glyph.</desc>
  <!--
    CapturePort mark: nine identical segments on one grid (rails at x 28 / 64 /
    100 and y 28 / 64 / 100; each segment 36 units long with a 12-unit stroke,
    5-unit chamfer, and 1.5-unit joints). Only the colour groups the letters.

      C  green  top-left, upper-left, lower-left, bottom-left        (4)
      P  amber  top-right, upper-right, middle-right, stem upper/lower (5)

    Every rail is two segments meeting at the middle, so the centre stem breaks
    exactly like the left rail. The stem sits in the C's opening, so the strokes
    read as "CP" while still tracing the frame and cross of 田.
  -->
  <rect width="128" height="128" rx="28" fill="#171a19"/>
  <path fill="#9ccbad" d="M34.5 22 L29.5 28 L34.5 34 L57.5 34 L62.5 28 L57.5 22Z M22 34.5 L28 29.5 L34 34.5 L34 57.5 L28 62.5 L22 57.5Z M22 70.5 L28 65.5 L34 70.5 L34 93.5 L28 98.5 L22 93.5Z M34.5 94 L29.5 100 L34.5 106 L57.5 106 L62.5 100 L57.5 94Z"/>
  <path fill="#e8b06a" d="M70.5 22 L65.5 28 L70.5 34 L93.5 34 L98.5 28 L93.5 22Z M94 34.5 L100 29.5 L106 34.5 L106 57.5 L100 62.5 L94 57.5Z M70.5 58 L65.5 64 L70.5 70 L93.5 70 L98.5 64 L93.5 58Z M58 34.5 L64 29.5 L70 34.5 L70 57.5 L64 62.5 L58 57.5Z M58 70.5 L64 65.5 L70 70.5 L70 93.5 L64 98.5 L58 93.5Z"/>
</svg>
