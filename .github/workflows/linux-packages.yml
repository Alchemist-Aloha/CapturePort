name: Linux packages

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.distro }} x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: ubuntu:24.04
          - distro: arch
            image: archlinux:base-devel
          - distro: fedora
            image: fedora:latest
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Install Ubuntu build dependencies
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git cmake clang pkg-config dpkg-dev file \
            libx11-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev \
            libasound2-dev libssl-dev libgtk-3-dev libgphoto2-dev

      - name: Install Arch build dependencies
        if: matrix.distro == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel ca-certificates curl git rust cargo cmake clang pkgconf \
            libx11 libxcb libxkbcommon libxkbcommon-x11 wayland fontconfig \
            freetype2 vulkan-headers vulkan-icd-loader alsa-lib openssl gtk3 libgphoto2

      - name: Install Fedora build dependencies
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y \
            gcc gcc-c++ make ca-certificates curl-minimal git cmake clang perl \
            pkgconf-pkg-config rpm-build \
            libX11-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel \
            wayland-devel fontconfig-devel freetype-devel vulkan-loader-devel \
            alsa-lib-devel openssl-devel gtk3-devel libgphoto2-devel

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.distro != 'arch'

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Each distro has its own toolchain and target directory; keep the
          # caches apart so one image cannot evict another's builds.
          key: ${{ matrix.distro }}
          cache-on-failure: true

      - name: Set package version
        run: |
          echo "CAPTUREPORT_VERSION=$(scripts/release-version.sh)" >> "$GITHUB_ENV"
          echo "CAPTUREPORT_OUTPUT_DIR=$GITHUB_WORKSPACE/dist" >> "$GITHUB_ENV"

      - name: Build Linux binary, portable archive, AppImage, and Debian package
        if: matrix.distro == 'debian'
        run: |
          scripts/build-portable.sh
          scripts/build-deb.sh
          scripts/build-appimage.sh
          install -Dm755 target/release/captureport dist/captureport-linux-x86_64
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Build pacman package as an unprivileged user
        if: matrix.distro == 'arch'
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env \
            CAPTUREPORT_VERSION="$CAPTUREPORT_VERSION" \
            PKGDEST="$CAPTUREPORT_OUTPUT_DIR" \
            bash -c 'mkdir -p "$PKGDEST"; cd packaging; makepkg --noconfirm'
          pacman -Qip dist/*.pkg.tar.zst
          pacman -Qlp dist/*.pkg.tar.zst

      - name: Build RPM package
        if: matrix.distro == 'fedora'
        run: |
          scripts/build-rpm.sh
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          rpm -qp --requires dist/*.rpm

      - name: Calculate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: captureport-${{ matrix.distro }}-x86_64-${{ env.CAPTUREPORT_VERSION }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish release
    needs: package
    # Only tagged runs publish; branch pushes keep the build-only artifacts.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          version=$(scripts/release-version.sh)
          mkdir -p dist
          # One naming scheme for every download: captureport-<version>-x86_64-<kind>.
          # The bare binary keeps its version-less name because install.sh
          # fetches it from whichever release is latest.
          publish() {
            local pattern=$1 name=$2
            mapfile -t matches < <(find artifacts -type f -name "$pattern")
            if [[ ${#matches[@]} -ne 1 ]]; then
              printf 'Expected one %s artifact, found %s\n' "$pattern" "${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "dist/$name"
          }
          publish 'captureport-linux-x86_64' 'captureport-linux-x86_64'
          publish '*.AppImage' "captureport-${version}-x86_64.AppImage"
          publish '*-portable.tar.gz' "captureport-${version}-x86_64-portable.tar.gz"
          publish '*.deb' "captureport-${version}-x86_64-debian-ubuntu.deb"
          publish '*.rpm' "captureport-${version}-x86_64-fedora.rpm"
          publish '*.pkg.tar.zst' "captureport-${version}-x86_64-arch.pkg.tar.zst"
          # One checksum file for the whole release, not three per-distro ones.
          ( cd dist && sha256sum * > SHA256SUMS )
          ls -l dist
          prerelease=false
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=true
          {
            echo "CAPTUREPORT_VERSION=$version"
            echo "CAPTUREPORT_PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"
          cat > release-notes.md <<EOF
          ## Downloads (Linux x86_64)

          | File | Use it for |
          | --- | --- |
          | \`captureport-${version}-x86_64.AppImage\` | Any distribution: \`chmod +x\` it and run. Bundles libgphoto2 and its camera drivers. |
          | \`captureport-${version}-x86_64-debian-ubuntu.deb\` | Debian / Ubuntu: \`sudo apt install ./captureport-${version}-x86_64-debian-ubuntu.deb\` |
          | \`captureport-${version}-x86_64-fedora.rpm\` | Fedora: \`sudo dnf install ./captureport-${version}-x86_64-fedora.rpm\` |
          | \`captureport-${version}-x86_64-arch.pkg.tar.zst\` | Arch: \`sudo pacman -U captureport-${version}-x86_64-arch.pkg.tar.zst\` |
          | \`captureport-${version}-x86_64-portable.tar.gz\` | Unpack anywhere and run \`captureport/run-captureport\` (uses system libraries). |
          | \`captureport-linux-x86_64\` | The bare binary used by the one-command installer. |
          | \`SHA256SUMS\` | Verify downloads: \`sha256sum -c SHA256SUMS --ignore-missing\` |

          All builds need a Vulkan-capable graphics driver.
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CapturePort ${{ env.CAPTUREPORT_VERSION }}
          body_path: release-notes.md
          prerelease: ${{ env.CAPTUREPORT_PRERELEASE }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
